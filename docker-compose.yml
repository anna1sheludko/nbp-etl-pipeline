services:
  postgres:
    image: postgres:15
    container_name: nbp_postgres
    environment:
      POSTGRES_DB: nbp_db
      POSTGRES_USER: nbp_user
      POSTGRES_PASSWORD: nbp_password
    ports:
      - "5433:5432"
    volumes:
      - nbp_data:/var/lib/postgresql/data
      - ./sql/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nbp_user -d nbp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  etl:
    build: .
    container_name: nbp_etl
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: ["python", "-m", "src.cli", "--log-level", "INFO"]

volumes:
  nbp_data: